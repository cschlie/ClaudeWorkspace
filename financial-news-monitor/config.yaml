# --- Private / unlisted instruments (news-only, via NewsAPI keyword search) ---
# Monitored for: news headlines only (no price data available)
# keywords: list of phrases that must appear in the article HEADLINE to alert.
#           Use specific multi-word phrases to avoid noise (e.g. "INEOS Finance"
#           not just "INEOS"). All instruments are batched into a single API call.
# ticker: short display label used in email alerts (not a real exchange ticker)
#
# Skipped entirely (no useful keywords exist):
#   X / Twitter (name appears in unrelated articles constantly)
#   CMBS 2016-C6 D / 2015-C32 B / 2015-C27 B / 2015-C29 D / 2015-C30 D
#     (structured products — no issuer name to search)
#   Digital Asset Treasury positions (portfolio category, not a company)
#   Pembroke (ambiguous — matches many unrelated entities)
#   Vend Marketplaces ASA → moved to instruments section as VEND.OL (Oslo Børs)
#   M&A / factor / asset-allocation category lines (not individual issuers)

keyword_watches:

  # ── Private Bond Vehicles ─────────────────────────────────────────────────
  - ticker: ADLER
    name: Adler Financing SARL
    type: bond
    keywords: ["Adler Financing", "Adler Real Estate"]

  - ticker: BELLIS
    name: Bellis Acquisition Company plc
    type: bond
    keywords: ["Bellis Acquisition", "Bellis Finco"]

  - ticker: MTBCO
    name: Motion Bondco Designated Activity Company
    type: bond
    keywords: ["Motion Bondco"]

  - ticker: SHRWD
    name: Sherwood Financing plc
    type: bond
    keywords: ["Sherwood Financing"]

  - ticker: INEOS
    name: INEOS Finance plc
    type: bond
    keywords: ["INEOS Finance", "INEOS Group"]

  - ticker: REKEEP
    name: Rekeep SpA
    type: bond
