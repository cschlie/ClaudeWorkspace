# Financial News Monitor Configuration
# =====================================================
# Copy .env.example to .env and fill in your API keys.

# --- Instruments to watch ---
# type: stock | convertible | bond | etf | crypto | index
# ticker: symbol used by Finnhub
# name: human-readable label used in alerts
#
# Excluded (private / no Finnhub coverage):
#   Adler Financing SARL, Cheplapharm, Rekeep SPA, MOTION BONDCO,
#   BELLIS ACQUISITION, Sherwood Financing, INEOS Finance,
#   CMBS 2016-C6 D / 2015-C32 B / 2015-C27 B / 2015-C29 D / 2015-C30 D,
#   X/Twitter (private), Eyecare Partners (private), DAT positions (category),
#   Kodiak AI KDK warrants (OTC), Waldorf Energy / Priority 1 Logistics /
#   Trustly / Vic Properties (all private), Nielsen (went private 2022),
#   Desktop Metal (acquired/delisted 2024), Stemmer Imaging (delisted),
#   SNP Schneider (delisted), Avidity Biosciences (acquired by Novartis),
#   Vend Marketplaces ASA (no ticker found), Cineworld (went private 2023),
#   Pembroke (unidentifiable), all M&A/factor/allocation category lines.
#
# NOTE: 44 instruments × 2 Finnhub calls each = 88 calls/cycle.
#   Free tier limit is 60/min — raise check_interval_minutes to 30
#   or upgrade your Finnhub plan if you see rate-limit warnings.

